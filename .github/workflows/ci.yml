name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      clickhouse:
        image: clickhouse/clickhouse-server:26.8.36
        env:
          CLICKHOUSE_USER: app
          CLICKHOUSE_PASSWORD: clickhouse
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
        ports:
          - 9000:9000
        options: >-
          --health-cmd "clickhouse-client --user app --password clickhouse --query 'SELECT 1'"
          --health-interval 3s
          --health-timeout 5s
          --health-retries 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Форматирование
        run: test -z "$(gofmt -l .)"
      - name: go vet
        run: go vet ./... && go vet -tags=integration ./...
      - name: Уязвимости в зависимостях
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: Unit-тесты с race detector
        run: go test -race -v ./...
      - name: Fuzz нормализации
        run: go test -run='^$' -fuzz=FuzzNormalize -fuzztime=20s ./internal/search
      - name: Интеграционные тесты с ClickHouse
        # SQL-файлы, проверки 04_checks.sql, публикация и сверка нормализации со всеми символами Unicode.
        run: go test -race -v -tags=integration ./tests/integration/
        env:
          CLICKHOUSE_ADDR: localhost:9000
          CLICKHOUSE_USER: app
          CLICKHOUSE_PASSWORD: clickhouse

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: docker-compose.yml валиден
        run: docker compose config -q
      - name: Сборка образа
        run: docker build -t search-tags:ci .
      - name: Бинарник в образе запускается
        # Сервиса рядом нет, поэтому -healthcheck должен честно вернуть 1. Любой другой код
        # (125/126/127 — образ не стартует, 0 — проверка ничего не проверяет) роняет шаг.
        run: |
          set +e
          docker run --rm search-tags:ci -healthcheck
          code=$?
          echo "код выхода: $code"
          test "$code" -eq 1

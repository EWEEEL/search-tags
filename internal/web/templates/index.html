<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Поисковые теги</title>
  <style>
    :root { color-scheme: light dark; --accent: #2f6fed; --border: #c9ced6; --muted: #6b7280; --chip: #eef2fb; }
    @media (prefers-color-scheme: dark) { :root { --accent: #8fb1ff; --border: #454b55; --muted: #a0a6b0; --chip: #252b38; } }
    * { box-sizing: border-box; }
    body { margin: 0; font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    main { max-width: 640px; margin: 0 auto; padding: 48px 16px; }
    h1 { margin: 0 0 20px; font-size: 24px; font-weight: 600; }
    form { display: flex; gap: 8px; }
    input { flex: 1; min-width: 0; padding: 10px 12px; font: inherit; border: 1px solid var(--border); border-radius: 8px; }
    button { padding: 10px 18px; font: inherit; font-weight: 500; color: #fff; background: #2f6fed; border: 0; border-radius: 8px; cursor: pointer; }
    button:hover { background: #2559c4; }
    ul { display: flex; flex-wrap: wrap; gap: 8px; margin: 20px 0 0; padding: 0; list-style: none; }
    li a { display: block; padding: 6px 12px; color: var(--accent); background: var(--chip); border-radius: 16px; text-decoration: none; }
    li a:hover { text-decoration: underline; }
    .message { margin: 20px 0 0; color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <h1>Поиск</h1>
    <form action="/" method="get" role="search">
      <input type="search" name="q" value="{{.Query}}" placeholder="Например, платье" aria-label="Поисковый запрос">
      <button type="submit">Найти</button>
    </form>
    {{- if .Failed}}
    <p class="message" role="alert">Не удалось загрузить теги. Попробуйте ещё раз чуть позже.</p>
    {{- else if .Tags}}
    <ul>
      {{- range .Tags}}
      <li><a href="/?q={{.Tag}}">{{.Tag}}</a></li>
      {{- end}}
    </ul>
    {{- else if .Searched}}
    <p class="message">Для этого запроса пока нет тегов</p>
    {{- end}}
  </main>
</body>
</html>
